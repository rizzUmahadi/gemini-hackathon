name: Gemini CLI

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  gemini-cli:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@gemini-cli')) ||
      (github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Gemini CLI
        uses: google-github-actions/run-gemini-cli@v0
        with:
          model: 'gemini-3-flash-preview'
          prompt: |
            If this is a Pull Request, please provide a comprehensive review of the changes, focusing on code quality, potential bugs, and architectural consistency.
            If this is a comment mentioning @gemini-cli, please respond to the user's query or feedback based on the context of the issue or PR.
